[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "iee"
version = "0.1.0"
description = "Herramientas reproducibles para el Índice de Eficiencia del Estado"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "rickHard29" }]
dependencies = []

[project.scripts]
iee-download = "iee.download:main"
iee-score = "iee.score:main"
iee-frontier-panel = "iee.frontier:main"

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
