[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "iee"
version = "0.1.0"
description = "Herramientas reproducibles para el Índice de Eficiencia del Estado"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "rickHard29" }]
dependencies = []

[project.scripts]
iee-download = "iee.download:main"
iee-score = "iee.score:main"
iee-frontier-panel = "iee.frontier:main"
iee-frontier-estimate = "iee.frontier_estimate:main"
iee-context-sensitivity = "iee.context_sensitivity:main"
iee-security-integration = "iee.security_integration:main"
iee-experimental-release = "iee.experimental_release:main"
iee-experimental-cohort = "iee.experimental_cohort_cli:main"
iee-cohort-recovery = "iee.cohort_recovery_cli:main"
iee-review-bundle = "iee.review_bundle_cli:main"
iee-recovery-source-screen = "iee.recovery_source_screen_cli:main"
iee-recovery-candidates = "iee.recovery_candidates_cli:main"

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
